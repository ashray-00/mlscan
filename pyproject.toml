[project]
name = "mlscan"
version = "0.1.0"
description = "Static supply-chain security scanner for ML model artifacts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ashray" }]
keywords = [
  "security",
  "supply-chain",
  "machine-learning",
  "pickle",
  "huggingface",
  "safetensors",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ashray-00/mlscan"
Repository = "https://github.com/ashray-00/mlscan"
Issues = "https://github.com/ashray-00/mlscan/issues"
Changelog = "https://github.com/ashray-00/mlscan/releases"

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7.0"]

[project.scripts]
mlscan = "mlscan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mlscan*"]
exclude = ["fixtures*", "tests*", "examples*"]
