[project]
name = "mlscan"
version = "0.1.0"
description = "Static supply-chain security scanner for ML model artifacts"
requires-python = ">=3.10"
dependencies = []  # stdlib-only core

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7.0"]

[project.scripts]
mlscan = "mlscan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mlscan*"]
exclude = ["fixtures*", "tests*", "examples*"]